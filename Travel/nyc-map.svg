    <circle class="dot" cx="52" cy="922" r="9"/><text class="num" x="52" y="922">6</text>
    <text class="lbl" x="68" y="926">Russ &amp; Daughters</text>
    <circle class="dot" cx="52" cy="944" r="9"/><text class="num" x="52" y="944">7</text>
    <text class="lbl" x="68" y="948">The Vessel</text>
    <circle class="dot" cx="52" cy="966" r="9"/><text class="num" x="52" y="966">8</text>
    <text class="lbl" x="68" y="970">Chelsea Market</text>
