    <circle class="dot" cx="227" cy="708" r="9"/><text class="num" x="227" y="708">12</text>
    <circle class="dot" cx="244" cy="700" r="9"/><text class="num" x="244" y="700">13</text>
    <circle class="dot" cx="166" cy="687" r="9"/><text class="num" x="166" y="687">14</text>
    <circle class="dot" cx="274" cy="692" r="9"/><text class="num" x="274" y="692">15</text>
    <circle class="dot" cx="282" cy="728" r="9"/><text class="num" x="282" y="728">16</text>
  </g>

  <g>
    <circle class="dot" cx="52" cy="812" r="9"/><text class="num" x="52" y="812">1</text>
    <text class="lbl" x="68" y="816">Grand Central Terminal</text>
    <circle class="dot" cx="52" cy="834" r="9"/><text class="num" x="52" y="834">2</text>
    <text class="lbl" x="68" y="838">Grand Central Madison (LIRR art walk)</text>
    <circle class="dot" cx="52" cy="856" r="9"/><text class="num" x="52" y="856">3</text>
    <text class="lbl" x="68" y="860">Le Parisien Bakery</text>
    <circle class="dot" cx="52" cy="878" r="9"/><text class="num" x="52" y="878">4</text>
    <text class="lbl" x="68" y="882">MoMA</text>
    <circle class="dot" cx="52" cy="900" r="9"/><text class="num" x="52" y="900">5</text>
