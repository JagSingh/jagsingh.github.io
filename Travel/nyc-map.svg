    <circle class="dot" cx="248" cy="582" r="9"/><text class="num" x="248" y="582">8</text>
    <circle class="dot" cx="231" cy="590" r="9"/><text class="num" x="231" y="590">9</text>
    <circle class="dot" cx="240" cy="564" r="9"/><text class="num" x="240" y="564">10</text>
