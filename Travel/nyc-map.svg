    <text class="lbl" x="372" y="816">Little Island</text>
    <circle class="dot" cx="356" cy="834" r="9"/><text class="num" x="356" y="834">10</text>
    <text class="lbl" x="372" y="838">IAC digital art wall (Pier 59)</text>
    <circle class="dot" cx="356" cy="856" r="9"/><text class="num" x="356" y="856">11</text>
    <text class="lbl" x="372" y="860">Brookfield Place &amp; North Cove</text>
    <circle class="dot" cx="356" cy="878" r="9"/><text class="num" x="356" y="878">12</text>
    <text class="lbl" x="372" y="882">9/11 Memorial</text>
    <circle class="dot" cx="356" cy="900" r="9"/><text class="num" x="356" y="900">13</text>
    <text class="lbl" x="372" y="904">Oculus</text>
    <circle class="dot" cx="356" cy="922" r="9"/><text class="num" x="356" y="922">14</text>
    <text class="lbl" x="372" y="926">Exchange Place &amp; waterfront walkway</text>
    <circle class="dot" cx="356" cy="944" r="9"/><text class="num" x="356" y="944">15</text>
    <text class="lbl" x="372" y="948">Xi'an Famous Foods, Chinatown</text>
    <circle class="dot" cx="356" cy="966" r="9"/><text class="num" x="356" y="966">16</text>
    <text class="lbl" x="372" y="970">Brooklyn Bridge (walk both ways)</text>
  </g>
</svg>
